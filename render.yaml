services:
  - type: web
    name: career-ai-backend
    runtime: docker
    rootDir: .
    dockerfilePath: ./apps/backend/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://ai-based-career-recommendation-system.pages.dev
      - key: FRONTEND_BASE_URL
        value: https://ai-based-career-recommendation-system.pages.dev
      - key: FRONTEND_VERIFY_URL
        value: https://ai-based-career-recommendation-system.pages.dev/verify?token={token}
      - key: FRONTEND_OAUTH_REDIRECT
        value: https://ai-based-career-recommendation-system.pages.dev/oauth/callback
      - key: GOOGLE_REDIRECT_URI
        value: https://career-ai-backend-elu0.onrender.com/api/auth/google/callback
      - key: ZALOPAY_CALLBACK_URL
        value: https://career-ai-backend-elu0.onrender.com/api/payment/callback
      - key: ZALOPAY_REDIRECT_URL
        value: https://ai-based-career-recommendation-system.pages.dev/payment/return
      - key: NEO4J_URL
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_DATABASE
        value: 9f9dcc33
      - key: NEO4J_PASS
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_API_TOKEN
        generateValue: true
