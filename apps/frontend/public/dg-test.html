<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Deepgram Streaming Test</title>
  <style>
    body { font-family: monospace; padding: 24px; background: #111; color: #eee; max-width: 700px; }
    button { padding: 10px 22px; margin: 6px 4px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; }
    #btnStart { background: #6366f1; color: white; }
    #btnStop  { background: #ef4444; color: white; display: none; }
    #transcript {
      margin-top: 16px; padding: 16px; background: #0f172a; border-radius: 10px;
      min-height: 80px; font-size: 16px; line-height: 1.7; color: #fff;
      border: 2px solid #6366f1;
    }
    .interim { color: #94a3b8; font-style: italic; }
    .final   { color: #fff; font-weight: bold; }
    #log { margin-top: 12px; padding: 12px; background: #1a1a2e; border-radius: 8px;
           font-size: 11px; max-height: 300px; overflow-y: auto; white-space: pre-wrap; }
    .ok   { color: #4ade80; } .err  { color: #f87171; }
    .info { color: #93c5fd; } .warn { color: #fbbf24; }
    .badge { padding: 3px 10px; border-radius: 20px; display: inline-block; font-size: 12px; margin: 4px 0; }
    .rec  { background: rgba(239,68,68,.2); color: #f87171; border: 1px solid #ef4444; }
    .idle { background: rgba(99,102,241,.2); color: #a5b4fc; border: 1px solid #6366f1; }
  </style>
</head>
<body>
  <h2 style="color:#a5b4fc">🎙 Deepgram SDK Streaming Test</h2>
  <p style="color:#6b7280;font-size:13px">
    Browser → Backend WebSocket (/ws/deepgram-stt) → Deepgram SDK → interim_results → real-time transcript.
  </p>

  <span id="badge" class="badge idle">Idle</span><br><br>

  <button id="btnStart">▶ Bắt đầu</button>
  <button id="btnStop">⏹ Dừng</button>
  <button onclick="document.getElementById('log').textContent=''" style="background:#374151;color:#9ca3af">🗑 Clear log</button>

  <div id="transcript"><span style="color:#374151">Transcript xuất hiện ở đây...</span></div>
  <div id="log"></div>

  <script>
    const $ = id => document.getElementById(id);
    const ts = () => new Date().toLocaleTimeString('vi-VN', {hour12:false});
    const log = (m, c='info') => {
      $('log').textContent += `[${ts()}] ${m}\n`;
      $('log').scrollTop = $('log').scrollHeight;
    };
    const setBadge = (t, c) => { $('badge').textContent = t; $('badge').className = 'badge ' + c; };

    // ── Init ──────────────────────────────────────────────────────────────────
    const token = localStorage.getItem('accessToken') || localStorage.getItem('token') || '';
    log(token ? `Token: ${token.length}chars ✓` : 'No token — WS may reject', token ? 'ok' : 'warn');

    let ws = null, mediaRec = null, stream = null;
    let finalText = '';

    $('btnStart').onclick = async () => {
      finalText = '';
      $('transcript').innerHTML = '<span style="color:#374151">Connecting...</span>';
      log('--- Starting ---', 'info');

      // 1. Get mic
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        log('Mic ✓', 'ok');
      } catch(e) {
        log(`Mic error: ${e.message}`, 'err'); return;
      }

      // 2. Open WebSocket
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const url = `${proto}//${location.host}/ws/deepgram-stt?lang=vi${token ? '&token='+encodeURIComponent(token) : ''}`;
      log(`Connecting: ${url.replace(/token=[^&]+/, 'token=***')}`, 'info');

      ws = new WebSocket(url);
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => log('WS open ✓', 'ok');

      ws.onmessage = ev => {
        try {
          const msg = JSON.parse(ev.data);
          if (msg.type === 'ready') {
            log('Deepgram ready ✓ — nói đi!', 'ok');
            setBadge('🔴 Đang ghi + streaming...', 'rec');
            startStreaming();
          } else if (msg.type === 'transcript') {
            const isFinal = msg.is_final;
            const txt = msg.accumulated || '';
            log(`${isFinal ? '[FINAL]' : '[interim]'} ${JSON.stringify(msg.text)}`, isFinal ? 'ok' : 'info');
            // Display: confirmed (white) + current interim (gray)
            $('transcript').innerHTML = `<span class="final">${msg.is_final ? msg.accumulated : (finalText ? finalText + ' ' : '')}</span><span class="interim">${msg.is_final ? '' : msg.text}</span>`;
            if (msg.is_final) finalText = msg.accumulated;
          } else if (msg.type === 'error') {
            log(`ERROR: ${msg.message}`, 'err');
          } else {
            log(`msg: ${JSON.stringify(msg).slice(0,80)}`, 'info');
          }
        } catch(e) { log(`Parse error: ${e}`, 'warn'); }
      };

      ws.onerror = e => log('WS error', 'err');
      ws.onclose = e => {
        log(`WS closed (code=${e.code})`, e.code === 1000 ? 'info' : 'warn');
        setBadge('Idle', 'idle');
        $('btnStart').style.display = ''; $('btnStop').style.display = 'none';
      };

      $('btnStart').style.display = 'none';
      $('btnStop').style.display = '';
    };

    function startStreaming() {
      const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
        ? 'audio/webm;codecs=opus'
        : MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
      log(`mimeType: ${mimeType || '(default)'}`, 'info');

      mediaRec = new MediaRecorder(stream, mimeType ? { mimeType } : {});
      mediaRec.ondataavailable = async ev => {
        if (ev.data.size < 50 || !ws || ws.readyState !== WebSocket.OPEN) return;
        const buf = await ev.data.arrayBuffer();
        ws.send(buf);
      };
      mediaRec.start(100); // 100ms chunks
      log('MediaRecorder started (100ms chunks)', 'ok');
    }

    $('btnStop').onclick = () => {
      log('Stopping...', 'info');
      if (mediaRec && mediaRec.state !== 'inactive') mediaRec.stop();
      if (stream) stream.getTracks().forEach(t => t.stop());
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send('stop');
        setTimeout(() => ws && ws.close(), 500);
      }
      $('btnStop').style.display = 'none';
      $('btnStart').style.display = '';
      setBadge('Idle', 'idle');
    };
  </script>
</body>
</html>
